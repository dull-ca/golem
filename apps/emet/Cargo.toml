[package]
name = "emet"
version.workspace = true
edition.workspace = true
license.workspace = true
default-run = "emetc"

[dependencies]
aes-siv = { workspace = true }
ariadne = "0.4.1"
blake3 = { workspace = true }
chumsky = "0.10"
clap = { workspace = true }
hex = { workspace = true }
