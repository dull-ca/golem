[workspace]
resolver = "2"
members = ["apps/golemd", "apps/golemctl", "apps/emet", "apps/emet-lsp", "libs/scroll-format", "libs/workspace-hack"]

[workspace.package]
version     = "0.4.0"
edition     = "2021"
license     = "AGPL-3.0-only"
rust-version = "1.75"

[workspace.dependencies]
# shared core
scroll-format = { path = "libs/scroll-format" }

# ecosystem
serde        = { version = "1", features = ["derive"] }
serde_json   = "1"
tokio        = { version = "1", features = ["full"] }
anyhow       = "1"
thiserror    = "1"
tracing      = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
async-trait  = "0.1"
chrono       = { version = "0.4", features = ["serde"] }
blake3       = "1"
aes-siv      = "0.7"
secretspec   = { version = "0.17", default-features = false }
postcard     = { version = "1", features = ["use-std"] }
sha2         = "0.10"
hex          = "0.4"
rusqlite     = { version = "0.31", features = ["bundled"] }
ed25519-dalek = "2"
zbus         = { version = "4", default-features = false, features = ["tokio"] }
nix          = { version = "0.29", features = ["user", "fs"] }
tempfile     = "3"
toml         = "0.8"
clap         = { version = "4", features = ["derive", "env"] }
reqwest      = { version = "0.12", default-features = false, features = ["json", "rustls-tls"] }
axum         = "0.7"
fastrand     = "2"
base64       = "0.22"
# Pinned to devenv's `0.8` line (ADR 0033 §3). The released 0.8.2 resolves the
# render/stderr API cleanly, so devenv's git patch to `main` is not needed; the
# `unstable-output-streams` feature supplies the stderr rendering an apply wants.
iocraft      = { version = "=0.8.2", features = ["unstable-output-streams"] }

[profile.release]
opt-level = "z"
lto       = true
strip     = true
codegen-units = 1
panic     = "abort"
