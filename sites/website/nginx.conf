# Serves the pre-built Starlight site under /var/www/html. Both docs images read
# this file unmodified: the published one flake.nix builds from
# `nginx-static-no-tls`, and the one the fleet tutorials build from the sibling
# Containerfile. Neither ever terminates TLS — the published image's nginx is
# compiled without ngx_http_ssl_module and cannot, so both sit behind a TLS
# terminator. See docs/adr/0052-nginx-static-docs-image.md.
#
# NOTE: a directive that only one of the two builds understands breaks the other.
# Keep this to core and the modules both ship.

daemon off;
worker_processes auto;
# NOTE: logs go to the container's stdout/stderr (access_log below too), not
# files -- nothing else in the image would read or rotate them.
error_log /dev/stderr warn;
# NOTE: /tmp, not the default /run -- the container runs as the unprivileged
# `nobody` user, which cannot write there.
pid /tmp/nginx.pid;

events {
    worker_connections 1024;
}

http {
    include       /etc/nginx/mime.types;
    default_type  application/octet-stream;
    access_log    /dev/stdout;
    # NOTE: nginx's default charset_types omit text/css, so without this list a
    # stylesheet goes out as bare `text/css` rather than
    # `text/css; charset=utf-8`.
    charset       utf-8;
    charset_types text/css
                  text/xml
                  text/plain
                  text/javascript
                  application/javascript
                  application/json
                  application/rss+xml
                  image/svg+xml;

    sendfile      on;
    tcp_nopush    on;
    server_tokens off;

    # NOTE: Astro emits no precompressed `.gz` siblings, so `gzip_static` alone
    # matches nothing and the ~94 KB JS bundle would go out uncompressed even to
    # clients sending `Accept-Encoding: gzip`. `gzip on` compresses at request
    # time; `gzip_static` stays because it wins whenever a `.gz` sibling does
    # exist and costs nothing when none does, so a build that starts
    # precompressing needs no config change. `text/html` is deliberately absent
    # from `gzip_types` -- nginx always compresses it and listing it is a no-op.
    gzip            on;
    gzip_static     on;
    gzip_vary       on;
    gzip_min_length 1024;
    gzip_types      application/javascript
                    text/javascript
                    text/css
                    image/svg+xml
                    application/json
                    application/xml
                    application/manifest+json;

    # SECURITY: the ranges below are RFC1918 private networks -- only a proxy on
    # a private network is trusted to set the client address. Never widen this to
    # 0.0.0.0/0; that lets any client spoof its own address in the logs.
    set_real_ip_from 10.0.0.0/8;
    set_real_ip_from 172.16.0.0/12;
    set_real_ip_from 192.168.0.0/16;
    real_ip_header   X-Forwarded-For;

    server {
        # NOTE: 8080, not 80 -- the container runs as the unprivileged `nobody`
        # user, and binding port 80 would need CAP_NET_BIND_SERVICE. This sits
        # behind a reverse proxy, so the privileged port buys nothing.
        listen      8080;
        root        /var/www/html;
        index       index.html;
        # Starlight emits a static 404.html; serving it for any missing path
        # gives unknown URLs the styled not-found page. nginx keeps the original
        # 404 status across this internal redirect -- do not spell it `=200`.
        error_page  404 /404.html;
        # NOTE: nginx builds its trailing-slash redirect from `listen`, not from
        # the request's Host header, so an absolute Location would send a reader
        # behind the proxy to `https://golem.yyc.dev:8080/...`. Relative
        # Locations resolve against whatever the client actually asked for.
        absolute_redirect off;

        location / {
            # NOTE: `$uri/` rather than `$uri/index.html` -- both serve Astro's
            # clean URLs, but only this one 301s `/guides/x` to `/guides/x/`
            # first, keeping one canonical URL per page.
            try_files $uri $uri/ =404;
        }
    }
}
