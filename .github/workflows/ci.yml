# Interim CI: the same gate as everywhere else (`nix flake check`, ADR 0035),
# run by GitHub Actions until the self-hosted golem-managed box exists.
# cachix-action configures the dull-ca cache for pull and pushes every path
# built during the check.
name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: cachix/install-nix-action@v31
      - uses: cachix/cachix-action@v15
        with:
          name: dull-ca
          authToken: ${{ secrets.DULL_CA_CACHIX_PRIVATE_KEY }}
      - run: nix flake check --print-build-logs
