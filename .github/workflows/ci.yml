# Interim CI: the gate is `nix flake check` (ADR 0035), run by GitHub Actions
# until the self-hosted golem-managed box exists. cachix-action configures the
# dull-ca cache for pull and pushes every path built during the check.
#
# There is nothing here but nix. The docs site builds purely (`websiteDist`),
# and the check that it actually serves is a derivation (`website-serves`), so
# both run under `nix flake check` on any machine with nix -- no bun, no docker,
# no shell script pretending to be a test.
#
# NOTE: this never publishes. Publishing happens only on a `v*` tag, in
# release.yml -- don't add a push step here.
name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  check:
    runs-on: ubuntu-latest
    # This job only reads the repo -- it never publishes. Stated explicitly so
    # the token stays read-only regardless of the repository or organisation
    # default, which can otherwise grant write.
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: cachix/install-nix-action@v31
      - uses: cachix/cachix-action@v15
        with:
          name: dull-ca
          authToken: ${{ secrets.DULL_CA_CACHIX_PRIVATE_KEY }}
      - run: nix flake check --print-build-logs
