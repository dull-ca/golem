# Publishing is interim under ADR 0035 §5, still open:
# docs/adr/0050-interim-ghcr-docs-image.md.
#
# `release` (ci/release.sh) is how a tag is meant to get here, but a hand-pushed
# tag reaches this file just the same, so the guards run again — every one that
# still can. The tag being unused is not among them; by now it exists.
# docs/adr/0053-guarded-releases-from-a-local-command.md.
name: Release

on:
  push:
    tags: ["v*"]

jobs:
  publish:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: cachix/install-nix-action@v31
      - uses: cachix/cachix-action@v15
        with:
          name: dull-ca
          authToken: ${{ secrets.DULL_CA_CACHIX_PRIVATE_KEY }}

      - name: Resolve the version and the commit
        run: |
          ci/release-guards.sh assert-releasable "$GITHUB_REF_NAME"
          echo "VERSION=${GITHUB_REF_NAME#v}" >> "$GITHUB_ENV"
          echo "RELEASE_COMMIT=$(git rev-parse "$GITHUB_SHA^{commit}")" >> "$GITHUB_ENV"
          if ci/release-guards.sh is-stable "$GITHUB_REF_NAME"; then
            echo "IS_STABLE_RELEASE=true" >> "$GITHUB_ENV"
          else
            echo "IS_STABLE_RELEASE=false" >> "$GITHUB_ENV"
          fi

      - name: Refuse to release a commit that is not on main
        run: ci/release-guards.sh assert-on-main "$RELEASE_COMMIT"

      # NOTE: the runner ships a v1 /etc/containers/registries.conf and nixpkgs'
      # skopeo reads only v2, so every skopeo call aborts while loading it,
      # before reaching the registry — as "get credentials: ... must be in v2
      # format but is in v1", which reads like a login failure and is not one.
      - name: Configure container registries.conf
        run: |
          cat > "$RUNNER_TEMP/registries.conf" <<'EOF'
          unqualified-search-registries = ["docker.io"]
          EOF
          echo "CONTAINERS_REGISTRIES_CONF=$RUNNER_TEMP/registries.conf" >> "$GITHUB_ENV"

      # Stdin in, authfile out: the token reaches neither the step script Actions
      # writes to disk nor skopeo's argv, where `--dest-creds` would leave it on
      # every call below.
      - name: Authenticate to ghcr.io
        env:
          REGISTRY_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          printf '%s' "$REGISTRY_TOKEN" | nix run nixpkgs#skopeo -- login \
            --username "$GITHUB_ACTOR" \
            --password-stdin \
            --authfile "$RUNNER_TEMP/ghcr-auth.json" \
            ghcr.io
          echo "GHCR_AUTHFILE=$RUNNER_TEMP/ghcr-auth.json" >> "$GITHUB_ENV"

      - name: Refuse to overwrite a published version
        run: ci/release-guards.sh assert-unpublished "$GITHUB_REF_NAME"

      # The gate runs here and not only in ci.yml, because a tag can point at any
      # commit (ADR 0050).
      - run: nix flake check --print-build-logs

      - name: Build the docs image
        run: nix build .#website-container --print-build-logs

      # skopeo reads nix's docker-archive output directly — no docker daemon —
      # and everything upstream of `docker-archive:result` is unaware ghcr.io
      # exists, so retargeting is an edit to these destinations (ADR 0050). Two
      # copies: skopeo has no "push and also tag".
      - name: Publish the versioned image to ghcr.io
        run: |
          nix run nixpkgs#skopeo -- copy \
            --dest-authfile "$GHCR_AUTHFILE" \
            docker-archive:result \
            "docker://$(ci/release-guards.sh image):${VERSION}"

      # A prerelease publishes under its own version tag only; dull-01 pulls
      # unpinned (ADR 0050).
      - name: Move :latest to this release
        if: env.IS_STABLE_RELEASE == 'true'
        run: |
          nix run nixpkgs#skopeo -- copy \
            --dest-authfile "$GHCR_AUTHFILE" \
            docker-archive:result \
            "docker://$(ci/release-guards.sh image):latest"
