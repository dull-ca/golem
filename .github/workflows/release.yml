# Interim per ADR 0035, same terms as ci.yml: GitHub Actions only until the
# self-hosted golem-managed box exists. Publishing to ghcr.io is itself an
# interim choice and does NOT resolve ADR 0035 §5, where the release mechanism
# is still open -- see docs/adr/0050-interim-ghcr-docs-image.md.
#
# Only a `v*` tag reaches this file, and a tag can point at ANY commit --
# nothing constrains it to one ci.yml already passed. So this workflow cannot
# borrow ci.yml's verdict and re-runs the full gate itself: `nix flake check`
# and the same container smoke test, both before the first skopeo copy. Without
# that, tagging an unverified commit would publish a broken image straight to
# `:latest`.
name: Release

on:
  push:
    tags: ["v*"]

jobs:
  publish:
    runs-on: ubuntu-latest
    # packages: write is what lets GITHUB_TOKEN authenticate the skopeo push
    # below; contents: read is actions/checkout's default requirement.
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4
      - uses: cachix/install-nix-action@v31
      - uses: cachix/cachix-action@v15
        with:
          name: dull-ca
          authToken: ${{ secrets.DULL_CA_CACHIX_PRIVATE_KEY }}

      # Before the site build, for the reason ci.yml gives: an in-tree `dist/`
      # changes which packages this gate walks.
      - run: nix flake check --print-build-logs

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Build the docs site
        working-directory: sites/website
        run: |
          bun install --frozen-lockfile
          bun run build

      - name: Build the docs image
        run: |
          GOLEM_SITE_DIST=$PWD/sites/website/dist \
            nix build --impure .#website-container --print-build-logs

      # Byte-for-byte the smoke test in ci.yml, and it must stay that way --
      # this is the last gate before the image is public.
      - name: Smoke test the image
        run: |
          docker load < result

          cleanup() {
            docker logs golem-smoke || true
            docker rm -f golem-smoke || true
          }
          trap cleanup EXIT

          docker run -d --name golem-smoke -p 8099:80 golem-website:latest

          for i in $(seq 1 30); do
            curl -sf -o /dev/null http://127.0.0.1:8099/ && break
            sleep 1
          done
          root=$(curl -s -o /dev/null -w '%{http_code}' http://127.0.0.1:8099/)
          ctype=$(curl -s -o /dev/null -w '%{content_type}' http://127.0.0.1:8099/)
          missing=$(curl -s -o /dev/null -w '%{http_code}' http://127.0.0.1:8099/definitely-not-here)
          test "$root" = 200 || { echo "FAIL root: $root"; exit 1; }
          case "$ctype" in
            text/html*) ;;
            *) echo "FAIL ctype: $ctype"; exit 1 ;;
          esac
          test "$missing" = 404 || { echo "FAIL 404: $missing"; exit 1; }
          echo "smoke test passed"

      # NOTE: the git tag is the sole source of the version.
      #
      # IS_STABLE_RELEASE gates the `:latest` move below. Only a plain
      # `vMAJOR.MINOR.PATCH` tag qualifies; `v1.2.3-rc1` and anything else
      # matching the `v*` trigger publishes under its own version tag but must
      # not become what an unpinned `docker pull` gets -- which is what dull-01
      # does.
      - name: Derive version from tag
        run: |
          echo "VERSION=${GITHUB_REF_NAME#v}" >> "$GITHUB_ENV"
          if [[ "$GITHUB_REF_NAME" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "IS_STABLE_RELEASE=true" >> "$GITHUB_ENV"
          else
            echo "IS_STABLE_RELEASE=false" >> "$GITHUB_ENV"
          fi

      # The runner's preinstalled container tooling ships a v1
      # /etc/containers/registries.conf; nixpkgs' skopeo only reads v2 and
      # aborts while loading that file, before it ever reaches the registry:
      #   fatal: get credentials: loading registries configuration
      #   "/etc/containers/registries.conf": registries.conf must be in v2
      #   format but is in v1
      # -- not a credentials or permissions problem, even though that's what a
      # failing `skopeo login` suggests. Pointing CONTAINERS_REGISTRIES_CONF at
      # this minimal v2 file bypasses the runner's copy entirely. Exported via
      # $GITHUB_ENV rather than a step `env:` because all three skopeo calls
      # below -- this login and both copies -- need it, not just the next step.
      - name: Configure container registries.conf
        run: |
          cat > "$RUNNER_TEMP/registries.conf" <<'EOF'
          unqualified-search-registries = ["docker.io"]
          EOF
          echo "CONTAINERS_REGISTRIES_CONF=$RUNNER_TEMP/registries.conf" >> "$GITHUB_ENV"

      # Logging in once, with the token on stdin and the credential left in a
      # file, keeps it out of both the step script Actions writes to disk and
      # skopeo's argv. `--dest-creds "user:$TOKEN"` would put it in the runner's
      # process table on every copy. `printf` is a bash builtin, so the token
      # never becomes a separate process's arguments either.
      - name: Authenticate to ghcr.io
        env:
          REGISTRY_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          printf '%s' "$REGISTRY_TOKEN" | nix run nixpkgs#skopeo -- login \
            --username "$GITHUB_ACTOR" \
            --password-stdin \
            --authfile "$RUNNER_TEMP/ghcr-auth.json" \
            ghcr.io

      # skopeo reads nix's docker-archive output directly -- no docker daemon,
      # no decompression of the gzipped archive. Everything upstream of
      # `docker-archive:result` is unaware ghcr.io exists, so retargeting to a
      # different registry later is a change to these destination arguments, not
      # a rewrite. Two copies because the version tag and `latest` are
      # independent refs in the registry; skopeo has no "push and also tag".
      #
      # The published name is `golem-docs`, not the image's internal
      # `golem-website` from `mkWebsiteContainer` -- the destination ref is what
      # dulliac reads, and it does not have to match.
      - name: Publish the versioned image to ghcr.io
        run: |
          nix run nixpkgs#skopeo -- copy \
            --dest-authfile "$RUNNER_TEMP/ghcr-auth.json" \
            docker-archive:result \
            docker://ghcr.io/dull-ca/golem-docs:${VERSION}

      - name: Move :latest to this release
        if: env.IS_STABLE_RELEASE == 'true'
        run: |
          nix run nixpkgs#skopeo -- copy \
            --dest-authfile "$RUNNER_TEMP/ghcr-auth.json" \
            docker-archive:result \
            docker://ghcr.io/dull-ca/golem-docs:latest
