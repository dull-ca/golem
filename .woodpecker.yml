# Woodpecker CI for Codeberg (ci.codeberg.org). Runs on every push and pull
# request, entirely through the nix toolchain: test the whole Cargo workspace,
# build the golemd/golemctl/emetc release binaries, build the static docs site
# with bun, and build (not push) the Caddy website container. Image push waits
# on a registry; see the caching notes at the bottom for the cachix speedup.
when:
  - event: push
  - event: pull_request
  # tag pushes (v0.1.0, ...) enter the pipeline so the release step can fire.
  - event: tag

variables:
  - &nix_image "nixos/nix:2.34.7"
  - &nix_env
    NIX_CONFIG: |
      experimental-features = nix-command flakes
      accept-flake-config = true

steps:
  nix:
    image: *nix_image
    environment: *nix_env
    commands:
      # test: run the whole workspace's tests through the nix toolchain.
      - nix develop --command cargo test --workspace
      # build binaries: release golemd/golemctl/emetc via the flake outputs.
      - nix build .#golemd .#golemctl .#emetc --print-build-logs --out-link result-bins
      - ls -l result-bins*/bin
      # static binaries: portable static-musl golemd/golemctl (pkgsStatic) for
      # deploying onto Debian guests without matching shared libraries.
      - nix build .#golemd-static .#golemctl-static --print-build-logs --out-link result-static
      - file result-static*/bin/golemd result-static*/bin/golemctl
      # site: build the Astro/Starlight static site with bun into dist/.
      - nix develop --command bash -c 'cd sites/website && bun install --frozen-lockfile && bun run build'
      # website container (BUILD ONLY, no push): package dist/ into a Caddy
      # image via dockerTools to prove it builds. dist/ is gitignored, so it is
      # passed by path with --impure rather than read from the flake source.
      - GOLEM_SITE_DIST="$CI_WORKSPACE/sites/website/dist" nix build --impure .#website-container --print-build-logs --out-link result-website
      - ls -l result-website

  # release: on a pushed version tag only, build the release artifacts and attach
  # them to the Forgejo/Codeberg release for that tag (ADR 0028). Inert until a
  # tag is pushed AND the FORGEJO_RELEASE_TOKEN secret is set in the Codeberg
  # repo's Woodpecker settings; absent the token the upload cannot authenticate.
  release:
    image: *nix_image
    environment: *nix_env
    when:
      - event: tag
    secrets:
      - forgejo_release_token
    commands:
      # build exactly the release outputs: static-musl agent+CLI (portable onto
      # Debian guests), native emetc compiler. NOT the dynamic golemd/golemctl
      # (not portable) and NOT tree-sitter-emet / website-container (not shipped).
      - nix build .#golemd-static .#golemctl-static .#emetc --print-build-logs --out-link result-release
      - mkdir -p dist
      - cp result-release*/bin/golemd  dist/golemd
      - cp result-release*/bin/golemctl dist/golemctl
      # the emetc flake output has pname `emet` and produces bin/emet; ship the
      # asset under the tool's documented name, emetc.
      - cp result-release*/bin/emet     dist/emetc
      # create the release object for CI_COMMIT_TAG, then upload each binary as an
      # asset, via the Gitea-compatible Forgejo release API (curl + jq, with a
      # jq-less sed fallback so the step stays dependency-free in the nix image).
      - |
        api="https://codeberg.org/api/v1/repos/dull/golem"
        rel=$(curl -sf -X POST "$api/releases" \
          -H "Authorization: token $FORGEJO_RELEASE_TOKEN" \
          -H "Content-Type: application/json" \
          -d "{\"tag_name\":\"$CI_COMMIT_TAG\",\"name\":\"$CI_COMMIT_TAG\"}" \
          | { command -v jq >/dev/null && jq -r .id || sed -n 's/.*"id":\([0-9]*\).*/\1/p'; })
        for f in golemd golemctl emetc; do
          curl -sf -X POST \
            "$api/releases/$rel/assets?name=$f" \
            -H "Authorization: token $FORGEJO_RELEASE_TOKEN" \
            -F "attachment=@dist/$f"
        done

# Caching
# -------
# Shared ci.codeberg.org runners give each step a fresh container, so /nix is
# empty every run and nothing persists across steps. Two mitigations:
#
# 1. No secret (active): all nix work runs in ONE step, so the /nix/store that
#    `nix build .#golemd` populates is reused by every later command in the
#    same container (bun/emetc/website all share it). cache.nixos.org still
#    substitutes every nixpkgs dependency, so only golem's own crates compile.
#
# 2. Real speedup (deferred, needs a CACHIX_AUTH_TOKEN secret): a cachix cache
#    persists golem's built store paths across runs. Set the secret in the
#    Codeberg repo CI settings, replace `golem` with the cache name, then wrap
#    the builds:
#
#      - nix profile install nixpkgs#cachix
#      - cachix use golem
#      - cachix watch-exec golem -- nix build .#golemd .#golemctl .#emetc
#
#    and declare the secret on the step:
#
#      secrets:
#        - cachix_auth_token
